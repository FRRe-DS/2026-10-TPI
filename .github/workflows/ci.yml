name: Continuous Integration (CI)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Lint, Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Compilar Contratos Compartidos
        run: npm run build --workspace=@g10-m8/contracts

      - name: Generar Prisma Client
        run: npm run prisma:generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/m8_db?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/m8_db?schema=public"

      - name: Validar Formato y Linters
        run: npm run lint --if-present

      - name: Ejecutar Pruebas Automatizadas
        run: npm run test --if-present

      - name: Compilar Workspaces
        run: npm run build
