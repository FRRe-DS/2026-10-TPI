name: Continuous Integration (CI)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Tests and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Compilar Contratos Compartidos
        run: npm run build --workspace=@g10-m8/contracts

      - name: Generar Prisma Client
        run: npm run prisma:generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/m8_db?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/m8_db?schema=public"

      - name: Validar Formato y Linters
        run: npm run lint --if-present

      - name: Ejecutar Pruebas Automatizadas
        run: npm run test --if-present

      - name: Run integration tests
        run: npm run test:integration

      - name: Compilar Workspaces
        run: npm run build

      - name: Validar Docker Build
        run: docker build -t g10-m8-backend:test .

  e2e:
    name: E2E (pending implementation)
    # Quitar el false cuando haya un test E2E
    if: ${{ false && github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'develop' }}
    runs-on: ubuntu-latest
    steps:
      - name: E2E placeholder
        run: echo "E2E tests have not been implemented yet."

  publish:
    name: Publish ${{ matrix.image }} to GHCR
    needs: validate
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: .
            dockerfile: Dockerfile
          - image: frontend
            context: .
            dockerfile: apps/frontend/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Define lowercase image name
        id: image
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
