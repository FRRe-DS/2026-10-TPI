# ========================================================
# Plataforma Distribuida de Movilidad Urbana - Grupo 10 (M8)
# Infraestructura Local de Dependencias y Persistencia (RNF-04)
# ========================================================

services:
  # Base de Datos PostgreSQL local (para quienes desarrollen sin conexión a Supabase)
  postgres:
    image: postgres:16-alpine
    container_name: g10_m8_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: m8_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres -d m8_db' ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - m8_internal_net

  # Redis para expiración y TTL de códigos QR (RF-8.3)
  redis:
    image: redis:7-alpine
    container_name: g10_m8_redis
    restart: unless-stopped
    command: redis-server --appendonly yes # Persistencia de datos en disco
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - m8_internal_net

  # RabbitMQ para comunicación asíncrona de eventos (M5, M6, M7, M9 -> M8)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: g10_m8_rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672' # AMQP protocol
      - '15672:15672' # Management Web Console (http://localhost:15672, guest:guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ 'CMD', 'rabbitmq-diagnostics', 'check_running' ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - m8_internal_net
      - microservices_net # Se incluye en la red debido a que otros modulos le mandan mensajes a M8

  # Mailpit para capturar y previsualizar emails en local (sin enviar correos reales)
  mailpit:
    image: axllent/mailpit:latest
    container_name: g10_m8_mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # Servidor SMTP
      - '8025:8025' # Web UI para ver emails (http://localhost:8025)
    networks:
      - m8_internal_net

  # Backend M8 (API NestJS) como contenedor
  backend:
    build: .                          # Construye la imagen con el Dockerfile de la raíz
    container_name: g10_m8_backend
    restart: unless-stopped
    env_file:
      - path: .env                    # Carga todas las variables de tu .env (si existe)
        required: false
    environment:                      # Sobreescribe los hosts para comunicación interna en Docker
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/m8_db
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/m8_db
      REDIS_HOST: redis
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - '3000:3000'                   # Tu PC:3000 -> contenedor:3000
    depends_on:                       # Espera a que las dependencias estén listas
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started    # Mailpit no tiene healthcheck
    networks:
      - microservices_net
      - m8_internal_net
    healthcheck:
      test: [ 'CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/health || exit 1' ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend Dashboard M8 (React + Vite) como contenedor (sin requerir npm install en el host)
  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
    container_name: g10_m8_frontend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api/v1}
    ports:
      - '5173:5173'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - m8_internal_net

  # Segunda API: Simulador del Módulo 6 (Viajes)
  api-viajes:
    build: ./apps/simulador-m6 # Construye la imagen con el Dockerfile de la carpeta del simulador
    container_name: g10_m6_api_viajes # Nombre del contenedor para identificarlo fácilmente
    restart: unless-stopped
    environment: # Sobreescribe solo estas del .env
      PUERTO: 3001
      URL_BACKEND_M8: http://backend:3000/api/v1
    ports:
      - '3001:3001'
    depends_on: # Espera a que el backend esté listo antes de iniciar el simulador
      backend:
        condition: service_healthy
    healthcheck: # Verifica que la API del simulador esté corriendo correctamente
      test: [ 'CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3001/salud || exit 1' ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - microservices_net

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  microservices_net: #Red donde van a hablar las APIs entre sí y con las dependencias
    driver: bridge
  m8_internal_net: #Red privada para el M8
    driver: bridge