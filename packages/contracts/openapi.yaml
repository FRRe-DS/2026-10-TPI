openapi: 3.0.3
info:
  title: "Módulo 8: Notificaciones, Documentos y Soporte (G10-M8)"
  description: "Contratos de interfaz REST oficiales para M8 - Plataforma Distribuida de Movilidad Urbana."
  version: "1.0.0"
  contact:
    name: "Grupo 10 - Desarrollo de Software 2026"

servers:
  - url: http://localhost:3000/api/v1
    description: Servidor de desarrollo local

paths:
  /health:
    get:
      summary: Verificación de estado del servicio
      operationId: getHealth
      tags:
        - Health
      responses:
        '200':
          description: Servicio saludable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /documents/qr/generate:
    post:
      summary: Generar código QR temporal de un solo uso (RF-8.3)
      operationId: generateQr
      tags:
        - Documentos y QR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateQrDto'
      responses:
        '201':
          description: QR generado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrResponseDto'
        '400':
          description: Parámetros inválidos

  /documents/qr/verify:
    post:
      summary: Validar y consumir código QR de un solo uso (RF-8.3 / RF-6.4)
      operationId: verifyQr
      tags:
        - Documentos y QR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyQrDto'
      responses:
        '200':
          description: QR verificado y consumido
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
                  tripId:
                    type: string
                  verifiedAt:
                    type: string
                    format: date-time
        '404':
          description: Token QR no encontrado o ya consumido
        '410':
          description: Token QR expirado (TTL vencido)

  /documents/receipts:
    post:
      summary: Registrar comprobante de viaje (RF-8.4)
      operationId: registerReceipt
      description: >
        Persiste los metadatos del comprobante en base de datos.
        Idempotente: si ya existe un comprobante para el tripId devuelve el existente
        sin crear un duplicado. El PDF se genera on-demand en el endpoint de descarga.
      tags:
        - Documentos y QR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterReceiptDto'
      responses:
        '201':
          description: Comprobante registrado (o existente devuelto si ya había uno para el tripId)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptResponseDto'
        '400':
          description: Datos de entrada inválidos

  /documents/receipts/{tripId}/download:
    get:
      summary: Descargar comprobante de viaje en PDF (RF-8.4)
      operationId: downloadReceiptPdf
      description: >
        Busca el comprobante registrado para el tripId y regenera el PDF
        con los datos originales (conservando la fecha de emisión real).
        No crea ni modifica registros. Devuelve 404 si no existe comprobante.
      tags:
        - Documentos y QR
      parameters:
        - name: tripId
          in: path
          required: true
          description: ID del viaje cuyo comprobante se desea descargar
          schema:
            type: string
            example: trip-abc-123
      responses:
        '200':
          description: PDF generado y servido como archivo adjunto
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: No existe comprobante registrado para este viaje

  /documents/receipts/resend:
    post:
      summary: Reenviar comprobante PDF por correo electrónico (RF-8.5)
      operationId: resendReceipt
      description: >
        Busca el comprobante registrado para el tripId, regenera el PDF con los
        datos y fecha originales, y lo envía como archivo adjunto al correo indicado.
        Devuelve 404 si el comprobante no existe y 502 si falla el envío de correo.
      tags:
        - Documentos y QR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendReceiptDto'
      responses:
        '200':
          description: Comprobante reenviado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendReceiptResponseDto'
        '400':
          description: Datos de entrada inválidos
        '404':
          description: Comprobante no encontrado para el tripId indicado
        '502':
          description: Error al enviar el correo electrónico (falla SMTP)


  /notifications/logs:
    get:
      summary: Consultar historial de entregas de notificaciones (RF-8.6)
      operationId: getNotificationLogs
      tags:
        - Notificaciones
      parameters:
        - name: recipient
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, SENT, FAILED]
      responses:
        '200':
          description: Lista de notificaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationLogDto'

  /support/tickets:
    post:
      summary: Crear ticket de soporte asociado a viaje, reserva o pago (RF-8.7)
      operationId: createTicket
      tags:
        - Soporte y Tickets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketDto'
      responses:
        '201':
          description: Ticket creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponseDto'
    get:
      summary: Listar tickets de soporte (RF-8.7)
      operationId: listTickets
      tags:
        - Soporte y Tickets
      responses:
        '200':
          description: Lista de tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketResponseDto'

  /support/tickets/{ticketId}/status:
    patch:
      summary: Actualizar estado de ticket de soporte (RF-8.7)
      operationId: updateTicketStatus
      tags:
        - Soporte y Tickets
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED]
                resolutionNote:
                  type: string
      responses:
        '200':
          description: Estado actualizado
        '404':
          description: Ticket no encontrado

components:
  schemas:
    RegisterReceiptDto:
      type: object
      required:
        - tripId
        - passengerId
        - passengerEmail
        - amount
      properties:
        tripId:
          type: string
          example: "trip-abc-123"
          description: "ID del viaje finalizado (viene de TripCompletedEvent de M6)"
        passengerId:
          type: string
          example: "usr-p-456"
        passengerEmail:
          type: string
          format: email
          example: "pasajero@ejemplo.com"
        amount:
          type: number
          format: float
          example: 3500.00
        currency:
          type: string
          default: ARS
          example: "ARS"
        driverName:
          type: string
          example: "Juan Conductor"

    ReceiptResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        receiptCode:
          type: string
          example: "REC-2026-00001"
        tripId:
          type: string
        passengerId:
          type: string
        passengerEmail:
          type: string
          format: email
        amount:
          type: number
        currency:
          type: string
        driverName:
          type: string
          nullable: true
        issuedAt:
          type: string
          format: date-time
          description: "Fecha de emisión original del comprobante"

    GenerateQrDto:
      type: object
      required:
        - tripId

        - passengerId
      properties:
        tripId:
          type: string
          example: "trip-uuid-1234"
        passengerId:
          type: string
          example: "usr-passenger-456"
        ttlSeconds:
          type: integer
          default: 300
          example: 300

    QrResponseDto:
      type: object
      properties:
        token:
          type: string
          example: "qr-sec-token-abcxyz"
        qrDataUrl:
          type: string
          description: "Data URL en formato Base64 para renderizar imagen PNG"
        expiresAt:
          type: string
          format: date-time

    VerifyQrDto:
      type: object
      required:
        - token
        - tripId
      properties:
        token:
          type: string
        tripId:
          type: string

    ResendReceiptDto:
      type: object
      required:
        - tripId
        - email
      properties:
        tripId:
          type: string
          example: "trip-abc-123"
        email:
          type: string
          format: email
          example: "pasajero@ejemplo.com"

    ResendReceiptResponseDto:
      type: object
      properties:
        success:
          type: boolean
          example: true
        tripId:
          type: string
          example: "trip-abc-123"
        receiptCode:
          type: string
          example: "REC-2026-00001"
        sentTo:
          type: string
          format: email
          example: "pasajero@ejemplo.com"
        timestamp:
          type: string
          format: date-time


    NotificationLogDto:
      type: object
      properties:
        id:
          type: string
        channel:
          type: string
          enum: [EMAIL, PUSH, SMS]
        recipient:
          type: string
        subject:
          type: string
        status:
          type: string
          enum: [PENDING, SENT, FAILED]
        retryCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    CreateTicketDto:
      type: object
      required:
        - referenceId
        - referenceType
        - subject
        - description
        - createdBy
      properties:
        referenceId:
          type: string
          example: "trip-1234"
        referenceType:
          type: string
          enum: [TRIP, RESERVATION, PAYMENT]
        subject:
          type: string
          example: "Problema con el cobro del viaje"
        description:
          type: string
          example: "Se debitó dos veces el importe de la tarifa."
        createdBy:
          type: string
          example: "usr-passenger-456"

    TicketResponseDto:
      type: object
      properties:
        id:
          type: string
        referenceId:
          type: string
        referenceType:
          type: string
        subject:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED]
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
